name: Build Pie Android Recorder

on:
  push:
    branches: [main]
    paths:
      - 'android-recorder/**'
      - '.github/scripts/**'
      - '.github/workflows/android-recorder.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Apply recorder upload diagnostics and deferred processing patch
        run: python android-recorder/patch_upload_status.py
      - name: Apply exact Pie tab restore patch
        run: python .github/scripts/patch_browser_return.py
      - name: Fix Kotlin regex escaping and return through Android back stack
        run: python .github/scripts/fix_browser_regex.py
      - name: Skip transient recorder screen on return
        run: python .github/scripts/patch_transient_recorder_return.py
      - name: Open exact YouTube source video
        run: python .github/scripts/patch_direct_source_launch.py
      - name: Reassert exact YouTube URL after app selector
        run: python .github/scripts/patch_youtube_source_reassert.py
      - name: Harden YouTube ad exclusion before capture
        run: python .github/scripts/patch_ad_gate.py
      - name: Guarantee recorder stops when YouTube playback ends
        run: python .github/scripts/patch_stop_watchdog.py
      - name: Build debug APK
        run: gradle -p android-recorder assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: pie-android-recorder-debug
          path: android-recorder/app/build/outputs/apk/debug/app-debug.apk
