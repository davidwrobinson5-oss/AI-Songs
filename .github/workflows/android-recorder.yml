name: Build Pie Android Recorder

on:
  push:
    branches: [main]
    paths:
      - 'android-recorder/**'
      - '.github/workflows/android-recorder.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Apply recorder upload diagnostics patch
        run: python android-recorder/patch_upload_status.py
      - name: Build debug APK
        run: gradle -p android-recorder assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: pie-android-recorder-debug
          path: android-recorder/app/build/outputs/apk/debug/app-debug.apk
