name: Apply Lyrics First generation once

on:
  push:
    branches:
      - lyrics-write-or-tools-2026-09-08

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lyrics-write-or-tools-2026-09-08
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply integration
        run: node scripts/apply-lyrics-first-generation.cjs
      - name: Commit generated source changes
        run: |
          git config user.name "Pie Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Integrate full-lyrics generation flow"
          git push origin HEAD:lyrics-write-or-tools-2026-09-08
