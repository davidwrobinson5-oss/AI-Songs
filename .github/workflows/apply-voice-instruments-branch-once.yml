name: Apply Voice to Instruments branch once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-voice-instruments-branch-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: voice-to-instruments-2026-09-08
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/apply-voice-instruments-ui.mjs
      - run: |
          git config user.name "Pie Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/VoiceWorkspace.tsx app/page.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add Voice to Instruments option"
          git push origin HEAD:voice-to-instruments-2026-09-08
