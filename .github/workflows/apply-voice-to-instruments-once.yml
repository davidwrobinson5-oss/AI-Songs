name: Apply Voice to Instruments once

on:
  push:
    branches: [voice-to-instruments-2026-09-08]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: voice-to-instruments-2026-09-08
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/apply-voice-to-instruments.mjs
      - name: Commit source changes
        run: |
          git config user.name "Pie Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/VoiceWorkspace.tsx app/page.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Integrate Voice to Instruments into Pie Voice"
          git push origin HEAD:voice-to-instruments-2026-09-08
