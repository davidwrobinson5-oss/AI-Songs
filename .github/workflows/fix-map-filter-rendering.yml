name: Fix Pie map filter rendering

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-map-filter-rendering.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Make selected venue types authoritative
        shell: python
        run: |
          from pathlib import Path
          path=Path('app/MapboxOpportunityMap.tsx')
          text=path.read_text()

          old="function venueMatchesSelection(venue:PieVenue,selected:string[]){if(!selected.length||selected.includes('all'))return true;const text=normalized(`${venue.venueType} ${venue.liveMusicStatus||''} ${venue.openMicStatus||''} ${venue.bookingNotes||''}`);return VENUE_FILTERS.filter(item=>selected.includes(item.key)).some(item=>item.matchTerms.some(term=>text.includes(normalized(term))))}"
          new=old+"\nfunction discoveredPlaceMatchesSelection(place:DiscoveredPlace,selected:string[]){if(!selected.length||selected.includes('all'))return true;const text=normalized(`${place.category||''} ${place.name}`);return VENUE_FILTERS.filter(item=>selected.includes(item.key)).some(item=>[...item.apiTerms,...item.searchTerms,...item.matchTerms].some(term=>{const needle=normalized(term);return needle.length>2&&text.includes(needle)}))}"
          if old not in text:
              raise SystemExit('venueMatchesSelection target missing')
          text=text.replace(old,new,1)

          old_terms="const terms=filterSearchTerms.length?Array.from(new Set([query,...filterSearchTerms].map(term=>term.trim()).filter(Boolean))).slice(0,8):discoveryTerms(query);"
          new_terms="const terms=filterSearchTerms.length?Array.from(new Set(filterSearchTerms.map(term=>term.trim()).filter(Boolean))).slice(0,8):discoveryTerms(query);"
          if old_terms not in text:
              raise SystemExit('search terms target missing')
          text=text.replace(old_terms,new_terms,1)

          old_loop="for(const place of results){if(verifiedPoints.some(point=>sameVenue(place,point.venue)))continue;"
          new_loop="for(const place of results){if(!discoveredPlaceMatchesSelection(place,selectedFilters))continue;if(verifiedPoints.some(point=>sameVenue(place,point.venue)))continue;"
          if old_loop not in text:
              raise SystemExit('marker loop target missing')
          text=text.replace(old_loop,new_loop,1)

          old_unresolved="const unresolved=results.filter(place=>!verifiedPoints.some(point=>sameVenue(place,point.venue)));"
          new_unresolved="const unresolved=results.filter(place=>discoveredPlaceMatchesSelection(place,selectedFilters)&&!verifiedPoints.some(point=>sameVenue(place,point.venue)));"
          if old_unresolved not in text:
              raise SystemExit('unresolved target missing')
          text=text.replace(old_unresolved,new_unresolved,1)

          path.write_text(text)

      - name: Commit strict venue filters
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- app/MapboxOpportunityMap.tsx; then
            echo 'No filter rendering changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/MapboxOpportunityMap.tsx
          git commit -m 'Make venue filters control visible map pins'
          git push
