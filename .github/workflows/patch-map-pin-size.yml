name: Shrink Pie map pins

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-map-pin-size.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reduce Mapbox marker sizes
        shell: python
        run: |
          from pathlib import Path
          path = Path('app/MapboxOpportunityMap.tsx')
          text = path.read_text()
          old_verified = "new window.mapboxgl.Marker({color:'#34A853'})"
          new_verified = "new window.mapboxgl.Marker({color:'#34A853',scale:0.6})"
          old_other = "new window.mapboxgl.Marker({color:place.id.startsWith('pie:')?'#8E44AD':'#EA4335'})"
          new_other = "new window.mapboxgl.Marker({color:place.id.startsWith('pie:')?'#8E44AD':'#EA4335',scale:0.5})"
          if old_verified in text:
              text = text.replace(old_verified, new_verified)
          if old_other in text:
              text = text.replace(old_other, new_other)
          path.write_text(text)

      - name: Commit smaller pins
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- app/MapboxOpportunityMap.tsx; then
            echo 'Pins already use smaller scaling.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/MapboxOpportunityMap.tsx
          git commit -m 'Reduce venue map marker size'
          git push
