name: Patch Pie dropdown theme

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-select-theme.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Apply dark select styling
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'PIE DARK SELECT CONTROLS' app/globals.css; then
            echo 'Dropdown styling already present.'
            exit 0
          fi
          cat >> app/globals.css <<'CSS'

/* PIE DARK SELECT CONTROLS */
select {
  color: #f7f3fb;
  background-color: #151219;
  border-color: rgba(255,255,255,.16);
  color-scheme: dark;
}
select option {
  color: #f7f3fb;
  background: #151219;
}
CSS
      - name: Commit dropdown styling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Pie Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add app/globals.css
          if git diff --cached --quiet; then
            echo 'No dropdown theme changes required.'
            exit 0
          fi
          git commit -m 'Fix Pie dropdown contrast'
          git push origin HEAD:main
