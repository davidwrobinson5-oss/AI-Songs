name: Patch Voice to Instruments branch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-select-theme.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: voice-to-instruments-2026-09-08
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/apply-voice-instruments-ui.mjs
      - name: Commit Voice to Instruments UI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Pie Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add app/VoiceWorkspace.tsx app/page.tsx
          if git diff --cached --quiet; then
            echo 'No Voice to Instruments UI changes required.'
            exit 0
          fi
          git commit -m 'Add Voice to Instruments option'
          git push origin HEAD:voice-to-instruments-2026-09-08
