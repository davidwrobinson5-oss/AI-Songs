name: Patch Pie venue search filters

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-venue-search-filters.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add multi-select venue search menu
        shell: python
        run: |
          from pathlib import Path

          path=Path('app/MapboxOpportunityMap.tsx')
          text=path.read_text()

          def replace_once(old,new,label):
              global text
              if old not in text:
                  raise SystemExit(f'Missing patch target: {label}')
              text=text.replace(old,new,1)

          replace_once(
              "export type DiscoveredPlace={id:string;name:string;address:string;coordinates:[number,number]};",
              "export type DiscoveredPlace={id:string;name:string;address:string;coordinates:[number,number];category?:string};",
              'DiscoveredPlace type',
          )

          filters = r'''

type VenueFilter={key:string;label:string;apiTerms:string[];searchTerms:string[];matchTerms:string[]};
const VENUE_FILTERS:VenueFilter[]=[
  {key:'all',label:'All Opportunities',apiTerms:[],searchTerms:[],matchTerms:[]},
  {key:'live_music',label:'Live Music Venues',apiTerms:['music','concert','performing_arts','concert_hall','theater','night_club'],searchTerms:['live music venue','concert hall','performing arts center'],matchTerms:['music','concert','theater','theatre','performing','club','venue']},
  {key:'open_mic',label:'Open Mics / Candidates',apiTerms:['bar','brewery','pub','lounge','community_center','church'],searchTerms:['open mic','open mic bar','open mic brewery'],matchTerms:['open mic','bar','brewery','pub','lounge','community','church']},
  {key:'bars',label:'Bars / Breweries / Clubs',apiTerms:['bar','brewery','pub','night_club','lounge'],searchTerms:['bar live music','brewery live music','music club'],matchTerms:['bar','brewery','pub','club','lounge']},
  {key:'casino',label:'Casinos / Resorts',apiTerms:['casino','resort','hotel_resort'],searchTerms:['casino live entertainment','resort live music'],matchTerms:['casino','resort']},
  {key:'hotel',label:'Hotels / Lodges',apiTerms:['hotel','lodge','inn','resort'],searchTerms:['hotel live entertainment','lodge event venue'],matchTerms:['hotel','lodge','inn','resort']},
  {key:'event',label:'Event / Convention Centers',apiTerms:['event_venue','convention_center','conference','banquet','community_center'],searchTerms:['event venue','event center','convention center'],matchTerms:['event','convention','conference','banquet','community']},
  {key:'faith',label:'Churches / Faith Venues',apiTerms:['church','place_of_worship','worship'],searchTerms:['church concert venue','worship center events'],matchTerms:['church','worship','faith','christian']},
  {key:'camp',label:'Campgrounds / Retreats',apiTerms:['campground','campsite','camp_site','retreat'],searchTerms:['campground events','retreat center events'],matchTerms:['campground','camp site','campsite','retreat']},
  {key:'festival',label:'Festivals / Fairs / Boardwalks',apiTerms:['festival','fair','fairground','boardwalk','amusement_park'],searchTerms:['festival grounds','fairgrounds','boardwalk events'],matchTerms:['festival','fair','boardwalk','amusement']},
  {key:'racing',label:'Racetracks / Speedways',apiTerms:['race_track','racetrack','speedway'],searchTerms:['racetrack events','speedway live entertainment'],matchTerms:['race track','racetrack','speedway']},
  {key:'parks',label:'Parks / Public Spaces',apiTerms:['park','public_space','waterfront'],searchTerms:['park concert venue','waterfront events'],matchTerms:['park','public space','waterfront']},
  {key:'college',label:'Colleges / Universities',apiTerms:['college_university','university','college'],searchTerms:['college concert venue','university performing arts'],matchTerms:['college','university','campus']},
  {key:'media',label:'Radio / TV / News',apiTerms:['radio_station','radio_studio','television_station','broadcast'],searchTerms:['radio station','television station','broadcast studio'],matchTerms:['radio','television','broadcast','news','tv']},
  {key:'showcase',label:'Talent Showcases / Auditions',apiTerms:['performing_arts','community_center','event_venue','talent','showcase'],searchTerms:['talent showcase','music audition','artist showcase'],matchTerms:['showcase','audition','talent','performing']},
  {key:'culture',label:'Museums / Cultural Centers',apiTerms:['museum','art_museum','cultural_center'],searchTerms:['museum event venue','cultural center performance'],matchTerms:['museum','cultural','art']},
  {key:'arena',label:'Arenas / Stadiums',apiTerms:['arena','stadium','auditorium'],searchTerms:['arena concert venue','stadium events','auditorium'],matchTerms:['arena','stadium','auditorium']},
  {key:'market',label:'Markets / Malls',apiTerms:['market','mall','shopping_center'],searchTerms:['market live music','mall events'],matchTerms:['market','mall','shopping']},
  {key:'food',label:'Restaurants / Wineries / Distilleries',apiTerms:['restaurant','winery','distillery','bar_and_grill'],searchTerms:['restaurant live music','winery live music','distillery live music'],matchTerms:['restaurant','winery','distillery','grill']},
  {key:'private',label:'Private / Weddings / Corporate',apiTerms:['wedding','banquet','event_venue','hotel'],searchTerms:['wedding venue live music','corporate event venue','banquet hall'],matchTerms:['wedding','corporate','banquet','private event']},
  {key:'other',label:'Other Performance Opportunities',apiTerms:['community_center','social_or_community_service'],searchTerms:['community performance venue','local event venue'],matchTerms:['community','social','performance opportunity']},
];
function selectedFilterTerms(selected:string[],field:'apiTerms'|'searchTerms'){if(!selected.length||selected.includes('all'))return [];return Array.from(new Set(VENUE_FILTERS.filter(item=>selected.includes(item.key)).flatMap(item=>item[field])))}
function venueMatchesSelection(venue:PieVenue,selected:string[]){if(!selected.length||selected.includes('all'))return true;const text=normalized(`${venue.venueType} ${venue.liveMusicStatus||''} ${venue.openMicStatus||''} ${venue.bookingNotes||''}`);return VENUE_FILTERS.filter(item=>selected.includes(item.key)).some(item=>item.matchTerms.some(term=>text.includes(normalized(term))))}
'''
          marker="const ALL_OPPORTUNITY_TERMS=['live music venue','open mic','bar live music','brewery live music','concert hall theater','event venue','casino resort entertainment','festival fairgrounds'] as const;"
          replace_once(marker,marker+filters,'filter definitions')

          replace_once(
              "function parseFeatures(data:any):DiscoveredPlace[]{return (Array.isArray(data?.features)?data.features:[]).flatMap((feature:any)=>{const coordinates=feature?.geometry?.coordinates;if(!Array.isArray(coordinates)||coordinates.length<2)return [];const lng=Number(coordinates[0]),lat=Number(coordinates[1]);if(!Number.isFinite(lng)||!Number.isFinite(lat))return [];return [{id:String(feature.id||`${lng}-${lat}`),name:String(feature.properties?.name||feature.text||'Performance opportunity'),address:String(feature.properties?.full_address||feature.properties?.place_formatted||''),coordinates:[lng,lat] as [number,number]}]})}",
              "function parseFeatures(data:any):DiscoveredPlace[]{return (Array.isArray(data?.features)?data.features:[]).flatMap((feature:any)=>{const coordinates=feature?.geometry?.coordinates;if(!Array.isArray(coordinates)||coordinates.length<2)return [];const lng=Number(coordinates[0]),lat=Number(coordinates[1]);if(!Number.isFinite(lng)||!Number.isFinite(lat))return [];return [{id:String(feature.id||`${lng}-${lat}`),name:String(feature.properties?.name||feature.text||'Performance opportunity'),address:String(feature.properties?.full_address||feature.properties?.place_formatted||''),coordinates:[lng,lat] as [number,number],category:String(feature.properties?.poi_category?.[0]||feature.properties?.maki||'')}]})}",
              'Mapbox parser',
          )
          replace_once(
              "function parsePieVenueData(data:any):DiscoveredPlace[]{return (Array.isArray(data?.venues)?data.venues:[]).flatMap((venue:any)=>{const c=venue?.coordinates;if(!Array.isArray(c)||c.length<2)return [];const lng=Number(c[0]),lat=Number(c[1]);if(!Number.isFinite(lng)||!Number.isFinite(lat))return [];const locality=[venue?.locality,venue?.region,venue?.postcode].filter(Boolean).join(', ');return [{id:`pie:${String(venue.id||`${lng}-${lat}`)}`,name:String(venue.name||'Performance opportunity'),address:String(venue.address||locality||''),coordinates:[lng,lat] as [number,number]}]})}",
              "function parsePieVenueData(data:any):DiscoveredPlace[]{return (Array.isArray(data?.venues)?data.venues:[]).flatMap((venue:any)=>{const c=venue?.coordinates;if(!Array.isArray(c)||c.length<2)return [];const lng=Number(c[0]),lat=Number(c[1]);if(!Number.isFinite(lng)||!Number.isFinite(lat))return [];const locality=[venue?.locality,venue?.region,venue?.postcode].filter(Boolean).join(', ');return [{id:`pie:${String(venue.id||`${lng}-${lat}`)}`,name:String(venue.name||'Performance opportunity'),address:String(venue.address||locality||''),coordinates:[lng,lat] as [number,number],category:String(venue.category||'')}]})}",
              'Pie parser',
          )

          replace_once(
              "const [autoSearch,setAutoSearch]=useState(true);const [moved,setMoved]=useState(false);const [loading,setLoading]=useState(false);const [error,setError]=useState('');const [results,setResults]=useState<DiscoveredPlace[]>([]);const [verifiedPoints,setVerifiedPoints]=useState<VerifiedPoint[]>([]);const [pieDirectoryCount,setPieDirectoryCount]=useState(0);",
              "const [autoSearch,setAutoSearch]=useState(true);const [moved,setMoved]=useState(false);const [loading,setLoading]=useState(false);const [error,setError]=useState('');const [results,setResults]=useState<DiscoveredPlace[]>([]);const [verifiedPoints,setVerifiedPoints]=useState<VerifiedPoint[]>([]);const [pieDirectoryCount,setPieDirectoryCount]=useState(0);const [filtersOpen,setFiltersOpen]=useState(false);const [selectedFilters,setSelectedFilters]=useState<string[]>(['all']);",
              'filter state',
          )

          replace_once("const context=`${query}|${location}`;","const context=`${query}|${location}|${selectedFilters.join(',')}`;",'search context')
          replace_once(
              "const terms=discoveryTerms(query);let piePlaces:DiscoveredPlace[]=[];",
              "const filterSearchTerms=selectedFilterTerms(selectedFilters,'searchTerms');const terms=filterSearchTerms.length?Array.from(new Set([query,...filterSearchTerms].map(term=>term.trim()).filter(Boolean))).slice(0,8):discoveryTerms(query);let piePlaces:DiscoveredPlace[]=[];",
              'search terms',
          )
          replace_once(
              "const params=new URLSearchParams({west:String(bounds.getWest()),south:String(bounds.getSouth()),east:String(bounds.getEast()),north:String(bounds.getNorth()),limit:'1000'});const pieResponse=await fetch(`/api/venues?${params}`",
              "const params=new URLSearchParams({west:String(bounds.getWest()),south:String(bounds.getSouth()),east:String(bounds.getEast()),north:String(bounds.getNorth()),limit:'1000'});const apiTerms=selectedFilterTerms(selectedFilters,'apiTerms').slice(0,20);if(apiTerms.length)params.set('categories',apiTerms.join(','));const pieResponse=await fetch(`/api/venues?${params}`",
              'directory categories',
          )
          replace_once("},[query,location,token]);\n\n  useEffect(()=>{let cancelled=false;async function geocodeVerified()", "},[query,location,token,selectedFilters]);\n\n  useEffect(()=>{let cancelled=false;async function geocodeVerified()", 'search dependencies')

          replace_once(
              "for(const point of verifiedPoints){markers.push(new window.mapboxgl.Marker({color:'#34A853'})",
              "for(const point of verifiedPoints){if(!venueMatchesSelection(point.venue,selectedFilters))continue;markers.push(new window.mapboxgl.Marker({color:'#34A853'})",
              'verified marker filter',
          )
          replace_once("},[results,verifiedPoints,onAddDiscovery]);","},[results,verifiedPoints,onAddDiscovery,selectedFilters]);",'marker dependencies')

          replace_once(
              "useEffect(()=>{if(mapRef.current)void search(false)},[query,location,search]);",
              "useEffect(()=>{if(mapRef.current)void search(false)},[query,location,token]);useEffect(()=>{if(mapRef.current)void search(true)},[selectedFilters]);",
              'filter refresh effect',
          )

          replace_once(
              "const unresolved=results.filter(place=>!verifiedPoints.some(point=>sameVenue(place,point.venue)));const research=",
              "const filteredVerifiedVenues=verifiedVenues.filter(venue=>venueMatchesSelection(venue,selectedFilters));const visibleVerifiedCount=verifiedPoints.filter(point=>venueMatchesSelection(point.venue,selectedFilters)).length;const unresolved=results.filter(place=>!verifiedPoints.some(point=>sameVenue(place,point.venue)));const toggleFilter=(key:string)=>setSelectedFilters(current=>{if(key==='all')return ['all'];const base=current.filter(item=>item!=='all');const next=base.includes(key)?base.filter(item=>item!==key):[...base,key];return next.length?next:['all']});const research=",
              'filter helpers',
          )

          menu = r'''<div className="statusBox" style={{display:'grid',gap:10}}><div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:10,flexWrap:'wrap'}}><button type="button" className={filtersOpen?'chip activeChip':'chip'} onClick={()=>setFiltersOpen(value=>!value)} aria-expanded={filtersOpen}>☰ Search Options</button><strong>{selectedFilters.includes('all')?'All venue types':`${selectedFilters.length} venue type${selectedFilters.length===1?'':'s'} selected`}</strong></div>{filtersOpen&&<div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(190px,1fr))',gap:8}}>{VENUE_FILTERS.map(option=><button type="button" key={option.key} className={selectedFilters.includes(option.key)?'chip activeChip':'chip'} onClick={()=>toggleFilter(option.key)} aria-pressed={selectedFilters.includes(option.key)} style={{textAlign:'left',justifyContent:'flex-start'}}>{selectedFilters.includes(option.key)?'✓ ':''}{option.label}</button>)}</div>}</div>'''
          replace_once(
              "return <div style={{display:'grid',gap:10}}><div style={{position:'relative'}}>",
              "return <div style={{display:'grid',gap:10}}>"+menu+"<div style={{position:'relative'}}>",
              'search options menu',
          )
          replace_once("🟢 {verifiedPoints.length} verified in Pie","🟢 {visibleVerifiedCount} verified in Pie",'visible verified count')
          replace_once("{verifiedVenues.length>0&&<div style={{display:'grid',gap:8'}}", "{filteredVerifiedVenues.length>0&&<div style={{display:'grid',gap:8'}}", 'verified list condition')
          replace_once("{verifiedVenues.map(venue=>", "{filteredVerifiedVenues.map(venue=>", 'verified list map')

          path.write_text(text)

      - name: Commit venue filter menu
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- app/MapboxOpportunityMap.tsx; then
            echo "No venue filter changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/MapboxOpportunityMap.tsx
          git commit -m "Add multi-select venue search options"
          git push
