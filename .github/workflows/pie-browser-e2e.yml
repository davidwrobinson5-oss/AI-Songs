name: Pie Browser E2E

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pie-browser-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Select isolated E2E target
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "PIE_E2E_BASE_URL=https://ai-songs-git-${{ github.head_ref }}-drobinhood1.vercel.app" >> "$GITHUB_ENV"
            echo "PIE_HEALTH_PUBLIC_REQUIRED=false" >> "$GITHUB_ENV"
            echo "PIE_EXPECTED_COMMIT_SHA=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"
          else
            echo "PIE_E2E_BASE_URL=https://ai-songs-drobinhood1.vercel.app" >> "$GITHUB_ENV"
            echo "PIE_HEALTH_PUBLIC_REQUIRED=true" >> "$GITHUB_ENV"
          fi
      - name: Wait for exact finished Pie preview
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            status="$(curl --location --silent --show-error --dump-header /tmp/pie-headers --output /tmp/pie-health --write-out '%{http_code}' "$PIE_E2E_BASE_URL/api/health" || true)"
            content_type="$(grep -i '^content-type:' /tmp/pie-headers 2>/dev/null | tail -1 | tr -d '\r' || true)"
            service_ready=false
            commit_ready=false

            if [[ "$content_type" == *"application/json"* ]] && grep -Eq '"service"[[:space:]]*:[[:space:]]*"pie"' /tmp/pie-health; then
              service_ready=true
            fi
            if grep -Eq '"commitSha"[[:space:]]*:[[:space:]]*"'"$PIE_EXPECTED_COMMIT_SHA"'"' /tmp/pie-health 2>/dev/null; then
              commit_ready=true
            fi

            if [[ "$service_ready" == true && "$commit_ready" == true ]]; then
              echo "Exact Pie preview is ready: $PIE_E2E_BASE_URL @ $PIE_EXPECTED_COMMIT_SHA (HTTP $status)"
              exit 0
            fi

            current_sha="$(sed -n 's/.*"commitSha"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' /tmp/pie-health | head -1 || true)"
            echo "Preview not on expected commit yet (HTTP $status, current=${current_sha:-unknown}, expected=$PIE_EXPECTED_COMMIT_SHA, attempt $attempt/60)."
            sleep 10
          done
          echo "Exact Pie preview did not become ready for browser E2E."
          echo "Last response headers:"
          cat /tmp/pie-headers || true
          echo "Last response body (first 1000 bytes):"
          head -c 1000 /tmp/pie-health || true
          exit 1
      - name: Verify Preview health contract
        if: github.event_name == 'pull_request'
        env:
          PIE_BASE_URL: ${{ env.PIE_E2E_BASE_URL }}
          PIE_EXPECTED_COMMIT_SHA: ${{ env.PIE_EXPECTED_COMMIT_SHA }}
          PIE_EXPECTED_ENVIRONMENT: preview
          PIE_EXPECTED_CLERK_MODE: test
          PIE_EXPECTED_STRIPE_MODE: test
          PIE_EXPECTED_PUBLIC: 'false'
          PIE_EXPECTED_GATED: 'false'
        run: node scripts/smoke-test.mjs
      - name: Install app dependencies
        run: npm ci
      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@1.55.0
      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run Pie browser tests
        run: npx playwright test
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pie-browser-e2e-${{ github.run_number }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 30
