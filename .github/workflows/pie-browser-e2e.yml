name: Pie Browser E2E

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pie-browser-e2e
  cancel-in-progress: true

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PIE_E2E_BASE_URL: https://ai-songs-drobinhood1.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install app dependencies
        run: npm ci
      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@1.55.0
      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run Pie browser tests
        run: npx playwright test
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pie-browser-e2e-${{ github.run_number }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 30
