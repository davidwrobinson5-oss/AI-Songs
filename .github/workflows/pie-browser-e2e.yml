name: Pie Browser E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pie-browser-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Select isolated E2E target
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "PIE_E2E_BASE_URL=https://ai-songs-git-${{ github.head_ref }}-drobinhood1.vercel.app" >> "$GITHUB_ENV"
            echo "PIE_HEALTH_PUBLIC_REQUIRED=false" >> "$GITHUB_ENV"
          else
            echo "PIE_E2E_BASE_URL=https://ai-songs-drobinhood1.vercel.app" >> "$GITHUB_ENV"
            echo "PIE_HEALTH_PUBLIC_REQUIRED=true" >> "$GITHUB_ENV"
          fi
      - name: Wait for finished Pie preview
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..48}; do
            status="$(curl --location --silent --show-error --dump-header /tmp/pie-headers --output /tmp/pie-health --write-out '%{http_code}' "$PIE_E2E_BASE_URL/api/health" || true)"
            content_type="$(grep -i '^content-type:' /tmp/pie-headers 2>/dev/null | tail -1 | tr -d '\r' || true)"
            if [[ "$content_type" == *"application/json"* ]] && grep -Eq '"service"[[:space:]]*:[[:space:]]*"pie"|Authentication required' /tmp/pie-health; then
              echo "Finished Pie preview is ready: $PIE_E2E_BASE_URL (HTTP $status)"
              exit 0
            fi
            echo "Preview not fully ready yet (HTTP $status, content-type: ${content_type:-unknown}, attempt $attempt/48)."
            sleep 10
          done
          echo "Finished Pie preview did not become ready for browser E2E."
          echo "Last response headers:"
          cat /tmp/pie-headers || true
          echo "Last response body (first 500 bytes):"
          head -c 500 /tmp/pie-health || true
          exit 1
      - name: Install app dependencies
        run: npm ci
      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@1.55.0
      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run Pie browser tests
        run: npx playwright test
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pie-browser-e2e-${{ github.run_number }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 30
