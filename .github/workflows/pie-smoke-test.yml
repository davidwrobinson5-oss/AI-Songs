name: Pie Smoke Test

on:
  push:
    branches: [main]
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pie-smoke-test
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PIE_BASE_URL: https://ai-songs-drobinhood1.vercel.app
      PIE_EXPECTED_ENVIRONMENT: production
      PIE_EXPECTED_CLERK_MODE: live
      PIE_EXPECTED_STRIPE_MODE: live
      PIE_EXPECTED_PUBLIC: 'false'
      PIE_EXPECTED_GATED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for the exact Production commit
        if: github.event_name == 'push'
        env:
          PIE_EXPECTED_COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..75}; do
            body="$(curl --location --silent --show-error "$PIE_BASE_URL/api/health" || true)"
            if grep -Eq '"commitSha"[[:space:]]*:[[:space:]]*"'"$PIE_EXPECTED_COMMIT_SHA"'"' <<< "$body"; then
              echo "Exact Production deployment is ready: $PIE_EXPECTED_COMMIT_SHA"
              exit 0
            fi
            echo "Waiting for Production commit $PIE_EXPECTED_COMMIT_SHA ($attempt/75)."
            sleep 10
          done
          echo "Production did not reach the expected commit."
          exit 1
      - name: Run Production health and parity checks
        env:
          PIE_EXPECTED_COMMIT_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
        run: node scripts/smoke-test.mjs
