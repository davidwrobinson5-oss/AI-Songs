name: Pie Nationwide Venue Import

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pie-venue-import.yml"
  workflow_dispatch:
    inputs:
      release:
        description: "Overture release (leave blank for latest)"
        required: false
        default: "2026-08-19.0"
  schedule:
    - cron: "17 7 25 * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: pie-nationwide-venue-import
  cancel-in-progress: false

jobs:
  import:
    name: Import ${{ matrix.region }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - region: Pacific-Northwest
            bbox: "-125.0,41.8,-116.8,49.1"
          - region: California-Nevada
            bbox: "-124.6,32.3,-113.8,42.1"
          - region: Mountain
            bbox: "-117.4,31.2,-101.8,49.1"
          - region: Texas-Plains
            bbox: "-106.8,25.7,-93.3,49.1"
          - region: Midwest
            bbox: "-103.2,35.8,-80.3,49.1"
          - region: Southeast
            bbox: "-94.1,24.2,-75.0,36.7"
          - region: MidAtlantic-Appalachia
            bbox: "-84.9,35.0,-73.0,42.6"
          - region: Northeast
            bbox: "-80.7,39.5,-66.7,47.6"
          - region: Alaska
            bbox: "-180.0,51.0,-129.0,72.0"
          - region: Hawaii
            bbox: "-161.0,18.5,-154.5,22.7"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install importer dependencies
        run: python -m pip install --disable-pip-version-check duckdb==1.3.2

      - name: Request GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          token_json="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=pie-venue-import")"
          token="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$token_json")"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Import Overture venues into Pie
        env:
          PIE_GITHUB_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          PIE_VENUE_IMPORT_URL: https://ynkrlatwwwaachijacmb.supabase.co/functions/v1/pie-venue-import
          PIE_IMPORT_REGION: ${{ matrix.region }}
          PIE_IMPORT_BBOX: ${{ matrix.bbox }}
          OVERTURE_RELEASE: ${{ github.event.inputs.release || '' }}
        run: python scripts/import_overture_venues.py
